version: '3.9'

services:
  backend:
    build: ./backend
    container_name: citation-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: citation-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
